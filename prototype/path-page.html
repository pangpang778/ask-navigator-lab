<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>路径页原型 — 三个结构迥异的变体(throwaway)</title>
<style>
  body{font-family:system-ui;margin:0;background:#f6f7f9;color:#1a1a1a}
  .bar{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center}
  .bar a{color:#8ab4ff;text-decoration:none;padding:4px 10px;border-radius:6px}
  .bar a.on{background:#2b6cb0}
  main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:20px} .muted{color:#667;font-size:13px}
  /* V1 线性台阶 */
  .steps{display:flex;flex-direction:column;gap:0;margin-top:16px}
  .step{display:flex;gap:12px;padding:12px 0;position:relative}
  .dot{width:28px;height:28px;border-radius:50%;background:#cbd5e0;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step.done .dot{background:#38a169}.step.locked{opacity:.45}.step.active .dot{background:#2b6cb0}
  .vline{position:absolute;left:14px;top:40px;bottom:-24px;width:2px;background:#cbd5e0}
  .step:last-child .vline{display:none}
  /* V2 课程卡片 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
  .card.locked{opacity:.45}.card .tag{font-size:12px;color:#2b6cb0}
  /* V3 双层进度 */
  .dual{margin-top:16px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
  .pbar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:6px 0 14px}
  .pbar>div{height:100%;background:#2b6cb0}
  ul{margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<main>
<h1>学习路径:前端工程师入门</h1>
<p class="muted">变体 V1/V2/V3 结构迥异;仅用于对实物做决策,throwaway。</p>
<div id="app"></div>
</main>
<div class="bar">变体切换:
<a href="?variant=1" class="on">V1 线性台阶</a><a href="?variant=2">V2 课程卡片</a><a href="?variant=3">V3 双层进度</a>
</div>
<script>
const courses=[
 {n:"HTML/CSS 基础",state:"done"},{n:"JavaScript 核心",state:"done"},
 {n:"TypeScript 入门",state:"active"},{n:"React 实战",state:"locked"},{n:"工程化与部署",state:"locked"}];
const v=new URLSearchParams(location.search).get("variant")||"1";
document.querySelectorAll(".bar a").forEach(a=>a.classList.toggle("on",a.href.endsWith("variant="+v)));
const app=document.getElementById("app");
if(v==="1")app.innerHTML=`<div class="steps">`+courses.map((c,i)=>`
 <div class="step ${c.state}"><div class="dot">${c.state==="done"?"✓":i+1}</div><div><b>${c.n}</b><div class="muted">${c.state==="done"?"已完成":c.state==="active"?"进行中":'未解锁'}</div></div><div class="vline"></div></div>`).join("")+`</div>`;
if(v==="2")app.innerHTML=`<div class="cards">`+courses.map(c=>`
 <div class="card ${c.state==="locked"?"locked":""}"><div class="tag">${c.state==="done"?"✓ 已完成":c.state==="active"?"▶ 进行中":"🔒 未解锁"}</div><b>${c.n}</b><div class="muted">4 周 · 18 课时</div></div>`).join("")+`</div>`;
if(v==="3")app.innerHTML=`<div class="dual"><b>路径进度 2/5</b><div class="pbar"><div style="width:40%"></div></div>
 当前课程:<b>TypeScript 入门</b><div class="pbar"><div style="width:60%"></div></div>
 <ul>${courses.map(c=>`<li>${c.n} — ${c.state==="done"?"完成":c.state==="active"?"进行中 60%":"未解锁"}</li>`).join("")}</ul></div>`;
</script>
</body>
</html>
